##
## @section Куда и под каким именем кладутся образы
##

## @param {string} namePrefix=fs- - Обязательное начало имени каждого образа.
## Образы лежат в одном общем пространстве имён с образами платформы, и имя
## PVC там плоское: `vm-default-images-<имя>`. Без своей приставки запись
## каталога рано или поздно перезапишет чужой образ. Чарт это проверяет и
## падает, если приставка пустая или имя совпало с платформенным.
namePrefix: "fs-"

## @param {string} [storageClass] - Класс хранения для всех образов.
## Пусто — класс по умолчанию в кластере.
storageClass: "replicated"

##
## @section Сами образы
##

## @typedef {struct} ImageOS - Что за система внутри.
## @field {string} [family] - Семейство, например Linux.
## @field {string} [name] - Название.
## @field {string} [version] - Версия.

## @typedef {struct} Emulates - Что машина изображает, если она эмулятор.
## @field {string} machine - Название машины, например «Burroughs B5500».
## @field {string} [note] - Пояснение: откуда взят эмулятор, что умеет.

## @typedef {struct} Image - Один загрузочный образ.
## @field {string} name - Имя без приставки. С приставкой оно станет адресом,
##        по которому образ виден в поле выбора у диска.
## @field {string} url - Откуда скачать образ.
## @field {quantity} [storage] - Сколько места отвести.
## @field {string} [storageClass] - Класс хранения только для этого образа.
## @field {ImageOS} [os] - Метаданные системы.
## @field {string} [architecture] - Архитектура гостя: amd64, arm64, s390x.
## @field {Emulates} [emulates] - Заполняется, если внутри образа эмулятор
##        машины, которой в этом кластере быть не может.
## @field {string} [description] - Человеческое описание.

## @param {[]Image} images - Список образов, которые публикуются в кластере.
images: []
