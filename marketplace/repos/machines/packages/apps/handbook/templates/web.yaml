apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "handbook.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: handbook
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{- include "handbook.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: docs
          image: {{ (.Values.image | default .Values.baseImage) | quote }}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /index.html, port: http }
          livenessProbe:
            httpGet: { path: /index.html, port: http }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run,   mountPath: /tmp }
            {{- if not .Values.image }}
            - { name: pages, mountPath: /usr/share/nginx/html, readOnly: true }
            - name: nginxconf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            {{- end }}
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: run,   emptyDir: {} }
        {{- if not .Values.image }}
        - name: pages
          configMap:
            name: {{ .Release.Name }}-pages
        - name: nginxconf
          configMap:
            name: {{ .Release.Name }}-nginx
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "handbook.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: handbook
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports: [{ name: http, port: 80, targetPort: http }]
{{- if .Values.host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "handbook.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingressClassName }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port: { name: http }
{{- end }}
