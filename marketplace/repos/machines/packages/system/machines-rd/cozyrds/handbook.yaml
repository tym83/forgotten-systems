# Сгенерировано tools/gen-appdefs.py из appdefs.yaml и
# apps/handbook/values.schema.json. Руками не править:
# `make gen` перезапишет, `make check` поймает расхождение.
apiVersion: cozystack.io/v1alpha1
kind: ApplicationDefinition
metadata:
  name: handbook
spec:
  application:
    kind: Handbook
    plural: handbooks
    singular: handbook
    openAPISchema: '{"$schema":"http://json-schema.org/draft-07/schema#","title":"handbook","type":"object","$comment":"Корень схемы НЕ закрыт намеренно: cozystack-engine подмешивает в values любого приложения тенанта свои ключи (_cluster, _namespace), и при additionalProperties:false Helm отвергает значения целиком — приложение не разворачивается. Ни один чарт платформы корень не закрывает. Вложенные объекты закрыты: туда движок ничего не кладёт.","properties":{"title":{"type":"string","minLength":1},"image":{"type":"string"},"baseImage":{"type":"string","minLength":1},"replicas":{"type":"integer","minimum":0},"host":{"type":"string"},"ingressClassName":{"type":"string"},"pages":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["name","title","body"],"properties":{"name":{"type":"string","pattern":"^[a-z0-9][a-z0-9-]*$"},"title":{"type":"string","minLength":1},"body":{"type":"string"}}}}}}'
  release:
    prefix: handbook-
    labels:
      sharding.fluxcd.io/key: tenants
    chartRef:
      kind: ExternalArtifact
      name: paleocomputing-machines-default-handbook
      namespace: cozy-system
  dashboard:
    singular: Handbook
    plural: Handbooks
    category: Forgotten Systems
    description: Документация, которая разворачивается рядом с приложением
    tags:
    - documentation
    - education
    keysOrder:
    - - apiVersion
    - - kind
    - - metadata
    - - metadata
      - name
    - - spec
      - title
    - - spec
      - pages
    - - spec
      - image
    - - spec
      - host
    icon: 
