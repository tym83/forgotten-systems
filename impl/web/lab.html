<!doctype html>
<meta charset="utf-8">
<title>Лаборатории: Оберон на настоящем Verilog</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f6f4; --fg:#1a1a1a; --mut:#666;
          --line:#d8d8d4; --ok:#1a7f37; --no:#a33; --acc:#2b5fa8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --fg:#e6e6e6; --mut:#9aa0a6; --line:#2e3238;
            --ok:#4ec36e; --no:#e06c6c; --acc:#7aa7e8; } }
  * { box-sizing: border-box }
  /* Раскладка во всю высоту окна: шапка и экран стоят на месте, прокручивается
     только колонка с заданиями. Иначе кнопка «Проверить» уезжает вверх вместе
     с тем, что она просит проверить глазами. */
  html, body { height:100% }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5
         ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; flex-direction:column; overflow:hidden }
  header { flex:none }
  header { padding:10px 16px; border-bottom:1px solid var(--line);
           display:flex; gap:14px; align-items:baseline; flex-wrap:wrap }
  header h1 { font-size:15px; margin:0; font-weight:600 }
  select, button { font:inherit; padding:5px 10px; border:1px solid var(--line);
                   border-radius:6px; background:transparent; color:inherit; cursor:pointer }
  button:hover { border-color:var(--acc) }
  main { flex:1; min-height:0; display:grid;
         grid-template-columns:minmax(0,1fr) 380px; gap:16px; padding:16px }
  .panel { min-height:0; overflow-y:auto; padding-right:4px }
  /* Экран закреплён, а колонка с заданиями мотается: иначе кнопка «Проверить»
     уезжает вверх вместе с тем, что надо проверять глазами. */
  .stage { position:sticky; top:12px; align-self:start }
  /* Никогда не увеличиваем сверх натурального размера: у машины экран
     1024x768, и при 1:1 точка машины ложится в точку экрана — текст резкий.
     Растянутая канва и крупнее, чем нужно, и мылится на нецелом масштабе. */
  /* У машины экран 1024x768. При 1:1 её точка ложится в точку экрана и текст
     самый резкий; целое двукратное увеличение тоже резкое, промежуточные —
     мылят, поэтому подписаны честно. Экран не обязан влезать в окно: при
     крупном масштабе колонка прокручивается. */
  /* Экран машины — 1024x768. Режим «вписать» подгоняет его под колонку (может
     чуть мылить на нецелом масштабе), остальные дают точный размер, а если он
     больше колонки — прокручивается сама рамка экрана, не страница. */
  .stage { --k:1; min-width:0; min-height:0; overflow:auto }
  canvas { image-rendering:pixelated; border:1px solid var(--line);
           background:#fff; display:block; margin:0 auto;
           width:calc(1024px * var(--k)); height:auto;
           max-width:none; aspect-ratio:1024/768 }
  .stage.fit canvas { width:100%; max-width:100% }

  /* На узком экране колонки схлопываются, и держать всё враспор нечем:
     возвращаемся к обычной прокрутке страницы. */
  @media (max-width:1100px) {
    html, body { height:auto }
    body { overflow:visible; display:block }
    main { display:block; min-height:0 }
    .panel, .stage { overflow:visible; min-height:0 }
    .stage.fit canvas { width:100% }
  }
  .panel > section { border:1px solid var(--line); border-radius:8px; padding:12px;
                     margin-bottom:12px }
  .intro { color:var(--mut) }
  ol { padding-left:22px; margin:0 }
  li { margin:0 0 14px }
  li.done::marker { color:var(--ok) }
  .res { margin-top:6px; font-size:13px }
  .res.ok { color:var(--ok) } .res.no { color:var(--no) }
  code { font:12px ui-monospace,SFMono-Regular,Menlo,monospace;
         background:color-mix(in srgb, var(--fg) 8%, transparent); padding:1px 4px; border-radius:3px }
  .stat { font:12px ui-monospace,Menlo,monospace; color:var(--mut) }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:8px }
  input { font:12px ui-monospace,Menlo,monospace; width:96px; padding:4px 6px;
          border:1px solid var(--line); border-radius:5px; background:transparent; color:inherit }
  .hint { color:var(--mut); font-size:13px }
  .payoff-box { border-left:2px solid var(--acc) }
  .payoff-h { font-size:12px; letter-spacing:.08em; text-transform:uppercase;
              color:var(--acc); margin:0 0 6px }
  #payoff { font-size:13.5px; line-height:1.55 }
  #payoff ul { margin:6px 0 0 -18px }
  pre.want { background:color-mix(in srgb, var(--fg) 7%, transparent); padding:8px 10px; overflow-x:auto;
             font:11px/1.45 ui-monospace,Menlo,monospace; margin:8px 0 }
</style>

<header>
  <h1 data-i18n-en="Labs · Oberon on real Verilog">Лаборатории · Оберон на настоящем Verilog</h1>
  <select id="pick"></select>
  <a href="book/index.html" style="color:var(--acc)" data-i18n-en="Handbook">Методичка</a>
  <button id="reset" data-i18n-en="Reset">Откатить</button>
  <button id="pause" data-i18n-en="Pause">Пауза</button>
  <label class="stat"><span data-i18n-en="mouse">мышь</span>
    <select id="btn">
      <option value="4" data-i18n-en="left — places the caret">левая — ставит курсор</option>
      <option value="2" data-i18n-en="middle — runs">средняя — запускает</option>
      <option value="1" data-i18n-en="right — selects">правая — выделяет</option>
    </select>
  </label>
  <label class="stat"><span data-i18n-en="language">язык</span>
    <select id="lang"></select>
  </label>
  <label class="stat"><span data-i18n-en="zoom">масштаб</span>
    <select id="zoom">
      <option value="fit" data-i18n-en="fit to window">вписать в окно</option>
      <option value="1" data-i18n-en="1:1 — sharp">1:1 — резко</option>
      <option value="1.25">1,25×</option>
      <option value="1.5">1,5×</option>
      <option value="2" data-i18n-en="2× — large">2× — крупно</option>
    </select>
  </label>
  <span class="stat" id="stat" title="Сколько команд выполнил процессор; адрес выполняемой сейчас команды; меняется ли картинка">загрузка…</span>
</header>

<main>
  <div class="stage"><canvas id="cv" width="1024" height="768"></canvas></div>
  <div class="panel">
    <section>
      <b id="title"></b> <span class="stat" id="level"></span>
      <div class="intro" id="intro"></div>
      <div class="row" id="read"></div>
    </section>
    <section id="toolbox" hidden>
      <b>Писать прямо в память</b>
      <div class="intro">Ни проверки прав, ни ловушки — машина такого не умеет.</div>
      <div class="row">
        адрес <input id="adr" value="E7F00"> значение <input id="val" value="FFFFFFFF">
        <button id="poke">Вписать</button>
      </div>
      <div class="row stat">счётчик команд: <b id="pc">—</b></div>
    </section>
    <section>
      <ol id="steps"></ol>
    </section>
    <section class="payoff-box"><h2 class="payoff-h" data-i18n-en="What this is about">В чём тут дело</h2>
      <div id="payoff"></div></section>
    <section><div class="hint" id="hint"></div></section>
  </div>
</main>

<script type="module">
import { Machine, attach, labelAltKeys, ALT_LABEL } from './machine.js';
import { LANG, LANGS, setLang, applyMarkup } from './i18n.js';
import { LABS } from './labs.js';

const $ = id => document.getElementById(id);
const hex = n => (n >>> 0).toString(16).toUpperCase();

// Язык: английский по умолчанию, русский по выбору. Выбор запоминается,
// а `?lang=ru` в адресе перебивает запомненное.
applyMarkup(document);
LANGS_FILL();
function LANGS_FILL() {
  const sel = $('lang');
  if (!sel) return;
  for (const [code, name] of Object.entries(LANGS)) {
    const o = document.createElement('option');
    o.value = code; o.textContent = name; o.selected = (code === LANG);
    sel.append(o);
  }
  sel.onchange = e => setLang(e.target.value);
}

const prom = new Uint32Array((await (await fetch('prom_sd.mem')).text())
  .trim().split('\n').map(l => parseInt(l, 16)));
const img = new Uint8Array(await (await fetch('oberon.dsk')).arrayBuffer());
const m = await Machine.create(prom, img);
const view = attach(m, $('cv'));

let lab = LABS[0];

LABS.forEach((l, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = `${l.id}. ${l.title} — ${l.level}`;
  $('pick').append(o);
});

function render() {
  $('title').textContent = lab.title;
  $('level').textContent = '· ' + lab.level;
  $('intro').innerHTML = lab.intro;
  $('hint').innerHTML = (LANG === 'ru' ? '<b>Подсказка.</b> ' : '<b>Hint.</b> ') + lab.hint;
  $('payoff').innerHTML = lab.payoff || '';
  document.querySelector('.payoff-box').hidden = !lab.payoff;
  $('toolbox').hidden = lab.tools !== 'poke';
  // Подписи клавиши-модификатора зависят от системы, а разметка приходит
  // строкой из labs.js — проставляем после каждой перерисовки.
  labelAltKeys(document);
  $('read').innerHTML = (lab.read || [])
    .map(([f, t]) => `<a href="book/${f}">📖 ${t}</a>`).join(' · ');
  $('steps').innerHTML = '';
  lab.steps.forEach((st, i) => {
    const li = document.createElement('li');
    li.innerHTML = st.text;
    const b = document.createElement('button');
    b.textContent = LANG === 'ru' ? 'Проверить' : 'Check';
    const res = document.createElement('div');
    res.className = 'res';
    let inp = null;
    if (st.answer) {
      inp = document.createElement('input');
      inp.placeholder = st.answer;
      inp.style.width = '150px';
    }
    b.onclick = () => {
      const r = st.check(m, { state: lab.state ??= {}, answer: inp ? inp.value : '' });
      res.className = 'res ' + (r.ok ? 'ok' : 'no');
      res.textContent = (r.ok ? '✅ ' : '— ') + r.msg;
      li.classList.toggle('done', r.ok);
    };
    const row = document.createElement('div');
    row.className = 'row';
    if (inp) row.append(inp);
    row.append(b);
    li.append(row, res);
    $('steps').append(li);
  });
}

let lastCrc = -1;
$('pick').onchange = e => { lab = LABS[+e.target.value]; lab.state = {}; render(); };
// Масштаб экрана. Выбор запоминается: человек настраивает его один раз.
const stage = document.querySelector('.stage'), zoom = $('zoom');
function applyZoom(k) {
  const fit = (k === 'fit');
  stage.classList.toggle('fit', fit);
  if (!fit) stage.style.setProperty('--k', k);
}
try {
  const saved = localStorage.getItem('oberon-zoom');
  if (saved && [...zoom.options].some(o => o.value === saved)) zoom.value = saved;
} catch (e) { /* приватное окно — просто остаёмся на 1:1 */ }
applyZoom(zoom.value);
zoom.onchange = () => {
  applyZoom(zoom.value);
  try { localStorage.setItem('oberon-zoom', zoom.value); } catch (e) {}
};

// Переключатель кнопки: на трекпаде средней нет, а правой протяжки не бывает.
$('btn').onchange = e => m.setButton(+e.target.value);

$('reset').onclick = () => { m.reset(); lab.state = {}; view.draw(); render(); };
$('pause').onclick = () => {
  if (view.running) { view.stop(); $('pause').textContent = 'Пуск'; }
  else { view.start(); $('pause').textContent = 'Пауза'; }
};
$('poke').onclick = () => {
  const a = parseInt($('adr').value, 16), v = parseInt($('val').value, 16);
  if (Number.isNaN(a) || Number.isNaN(v)) return;
  m.poke(a, v);
};

render();
view.start();
setInterval(() => {
  // Сумма кадрового буфера сама по себе человеку ничего не говорит — показываем
  // из неё то единственное, что важно: рисует машина или замерла.
  const crc = m.fbCrc(), drawing = crc !== lastCrc; lastCrc = crc;
  $('stat').textContent =
    (LANG === 'ru'
      ? `${(m.insns / 1e6).toFixed(1)} млн команд · адрес ${hex(m.pc)} · экран ${drawing ? 'меняется' : 'замер'}`
      : `${(m.insns / 1e6).toFixed(1)}M instructions · at ${hex(m.pc)} · screen ${drawing ? 'changing' : 'still'}`);
  $('pc').textContent = hex(m.pc);
}, 250);
</script>
