# Проверка браузерного слоя на каждую правку.
#
# До этого в репозитории не запускалось автоматически НИЧЕГО, кроме раскладки
# сайта и сборки образов по тегу. Это стоило двух тихих поломок разом:
# `make labs` падал на первой же строке с тех пор, как появился выбор языка
# (в node нет `location`), а сайт месяц отдавал прошлогоднюю лабораторию.
# Обе видны за полторы минуты — но только если кто-то смотрит.
#
# Здесь нет ни RTL, ни QEMU: им нужны verilator, emsdk и часы. Прогон машины
# берёт собранные risc5.js и risc5.wasm прямо из репозитория — они там лежат
# потому, что Pages раздаёт статику как есть.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Единственная внешняя зависимость сборки методички.
      - name: markdown
        run: pip install --quiet 'markdown==3.10.2'

      # Методичка: проверяются ссылки между главами и ссылки на лабораторные.
      - name: Методичка
        run: python3 tools/mkbook.py
        working-directory: impl

      # Лаборатории: каждая обязана перейти из «не сделано» в «сделано» от
      # предусмотренных действий. Гоняет настоящую машину на wasm.
      - name: Лаборатории
        run: node labs-test.mjs
        working-directory: impl/web

      # Сайт: состав и все местные ссылки. Именно этой проверки не хватало,
      # когда /oberon/book/en/ отдавал живой 404.
      - name: Сборка сайта
        run: ./tools/build-site.sh _site

      # Методичка собирается из docs/book/*.md. Если сборка что-то изменила,
      # значит в репозитории лежит не то, что собирается — та же болезнь, что
      # и копия сайта, только внутри одного каталога.
      - name: Собранное совпадает с тем, что в репозитории
        run: git diff --exit-code -- impl/web/book
