# Публикация образов лаборатории.
#
# Собирается и подписывается здесь, а не с чьего-то ноутбука, по двум причинам.
# Во-первых, подпись cosign делается БЕЗ КЛЮЧА: сборка получает от GitHub
# одноразовое удостоверение, им и подписывает, а запись в публичном журнале
# прозрачности фиксирует, что артефакт собран именно этим процессом в этом
# репозитории. Хранить и беречь нечего. Во-вторых, ровно поэтому личностью
# подписи становится сам процесс сборки — проверить её сможет кто угодно,
# не доверяя нам на слово.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег образов (по умолчанию dev)'
        required: false
        default: dev

permissions:
  contents: read
  packages: write
  id-token: write        # без этого не выдаётся удостоверение для подписи

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oberon-web
            file: deploy/Containerfile.web
          - name: oberon-lab
            file: deploy/Containerfile
          # Среда языка: компилятор Вирта без операционной системы. Это то,
          # что берёт langpack для разовых прогонов и постоянной службы.
          - name: oberon-run
            file: deploy/Containerfile.oberon-run
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - id: meta
        run: |
          tag="${{ github.event.inputs.tag }}"
          [ -n "$tag" ] || tag="${GITHUB_REF##*/}"
          [ "$tag" != "$GITHUB_REF" ] || tag=dev
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          echo "image=${{ env.REGISTRY }}/$owner/paleocomputing/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Контекст сборки — impl/: оба описания копируют rtl/, web/, tools/ и
      # прочее относительно него.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: impl
          file: impl/${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # Подписывается дайджест, а не тег: тег можно переставить на другой
      # образ, дайджест — нет.
      - name: Подписать образ
        run: cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Проверить, что подпись действительно легла
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

      # ⚠ Проверяем СОДЕРЖИМОЕ, а не факт сборки.
      #
      # Образ раздачи однажды вышел без машины: risc5.wasm и oberon.dsk —
      # продукты сборки, они в .gitignore, и `COPY web/` копировал то, чего
      # нет. Страница отдавалась, код ответа 200, размер верный — и в кластере
      # это выглядело успехом, пока никто не попробовал её открыть.
      #
      # Отсюда правило: после выкладки лезть внутрь и смотреть, что там лежит.
      - name: Проверить, что в образе есть чем работать
        run: |
          set -euo pipefail
          ref="${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
          case "${{ matrix.name }}" in
            oberon-web) want="risc5.wasm risc5.js risc5-chk.wasm risc5-chk.js bench_bounds.json oberon.dsk prom_sd.mem lab.html checks.html"
                        dir=/usr/share/nginx/html ;;
            oberon-run) want="prom.bin oberon.dsk"
                        dir=/opt/oberon/payload ;;
            *)          want=""; dir="" ;;
          esac
          [ -n "$want" ] || { echo "для ${{ matrix.name }} проверки содержимого нет"; exit 0; }
          for f in $want; do
            docker run --rm --entrypoint sh "$ref" -c "test -s $dir/$f" \
              || { echo "❌ в образе нет $dir/$f"; exit 1; }
            echo "  ✅ $f"
          done

      - name: Итог
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── Образ virt-launcher с машиной RISC5 ───────────────────────────────────
  #
  # Эмулятор в кластере живёт здесь, а не в oberon-run: тот несёт только ПЗУ
  # и диск. Раньше этот образ собирался руками на стенде, и выложенный отставал
  # от кода — свойства chk в нём не было, хотя каталог уже умел его просить.
  #
  # Тег несёт версию KubeVirt: launcher обязан совпадать с ней (находка 44).
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # install: true — чтобы `docker build` внутри build.sh шёл через buildx
      # и умел кэш, подпись происхождения и выкладку.
      - uses: docker/setup-buildx-action@v3
        with:
          install: true

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - id: meta
        run: |
          tag="${{ github.event.inputs.tag }}"
          [ -n "$tag" ] || tag="${GITHUB_REF##*/}"
          [ "$tag" != "$GITHUB_REF" ] || tag=dev
          kv=$(sed -n 's|^FROM quay.io/kubevirt/virt-launcher:||p' kubevirt/Containerfile)
          [ -n "$kv" ] || { echo "не найдена версия KubeVirt в Containerfile"; exit 1; }
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          echo "image=${{ env.REGISTRY }}/$owner/paleocomputing/virt-launcher" >> "$GITHUB_OUTPUT"
          echo "tag=$kv-risc5-$tag" >> "$GITHUB_OUTPUT"

      - id: build
        run: |
          set -euo pipefail
          kubevirt/build.sh "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            --push --provenance=true --sbom=true \
            --cache-from type=gha,scope=launcher \
            --cache-to type=gha,scope=launcher,mode=max \
            --metadata-file /tmp/meta.json
          echo "digest=$(jq -r '."containerimage.digest"' /tmp/meta.json)" >> "$GITHUB_OUTPUT"

      - name: Подписать образ
        run: cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

      # Содержимое, а не факт сборки: машина в образе должна знать chk —
      # ради этого образ и пересобирается.
      - name: Проверить, что эмулятор знает chk
        run: |
          set -euo pipefail
          ref="${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
          docker run --rm --entrypoint /usr/local/bin/qemu-system-risc5 "$ref" \
            -machine oberon,help | tee /tmp/props.txt
          grep -q '^ *chk=' /tmp/props.txt || { echo "❌ у машины нет свойства chk"; exit 1; }
          docker run --rm --entrypoint sh "$ref" -c 'test -x /usr/bin/onDefineDomain' \
            || { echo "❌ в образе нет перехватчика"; exit 1; }

      - name: Итог
        run: |
          echo "### virt-launcher" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── Три репозитория каталога как OCI-артефакты ────────────────────────────
  #
  # Публикует их flux: артефакт каталога — это не образ контейнера, а слепок
  # дерева файлов, и собирает его именно он. cozypkg сверху добавляет проверку
  # структуры и отказывается публиковать то, что не разберёт платформа.
  #
  # Оба инструмента ставятся в раннер и живут только на время сборки.
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # cozypkg берёт из git источник и ревизию артефакта

      - name: Поставить flux
        uses: fluxcd/flux2/action@main

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # cozypkg собирается из исходников: в выпущенных бинарях команды validate
      # ещё нет, а go install на этом модуле не работает — в его go.mod есть
      # replace-директивы. Коммит прибит гвоздями, чтобы сборка не менялась под
      # ногами вместе с чужой веткой.
      - name: Собрать cozypkg
        env:
          COZYSTACK_SHA: ff52aeb44e54d5e851ca18a343e7b66a15c9e571
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout             https://github.com/cozystack/cozystack.git /tmp/cozystack
          git -C /tmp/cozystack checkout --quiet "$COZYSTACK_SHA"
          ( cd /tmp/cozystack && go build -o /tmp/cozypkg ./cmd/cozypkg )
          sudo install -m755 /tmp/cozypkg /usr/local/bin/cozypkg
          cozypkg validate --help >/dev/null && echo "cozypkg собран, validate на месте"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - name: Проверить каталог перед публикацией
        run: |
          set -euo pipefail
          for r in machines languages images; do
            echo "── repos/$r"
            cozypkg validate "marketplace/repos/$r"
          done

      - name: Выложить и подписать
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag }}"
          [ -n "$tag" ] || tag="${GITHUB_REF##*/}"
          [ "$tag" != "$GITHUB_REF" ] || tag=dev
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          echo "### Каталог" >> "$GITHUB_STEP_SUMMARY"
          for r in machines languages images; do
            ref="ghcr.io/$owner/paleocomputing/$r:$tag"
            cozypkg push "oci://$ref" --path "marketplace/repos/$r"
            # Подписывается дайджест: cosign сам разрешает тег в него.
            cosign sign --yes "$ref"
            cosign verify \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$ref" >/dev/null
            echo "- \`$ref\` — выложен и подпись проверена" >> "$GITHUB_STEP_SUMMARY"
          done
