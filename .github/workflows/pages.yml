# Публикация сайта серии на GitHub Pages.
#
# Классический источник Pages умеет отдавать только корень репозитория или
# /docs, а сайт собирается в /_site — поэтому раскладка идёт через Actions.
#
# Сборка — tools/build-site.sh, та же команда, что и локально (`make site` в
# impl/). Одна команда на два места: раскладка не может разойтись с тем, что
# видно у себя.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'impl/web/**', 'tools/build-site.sh', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные раскладки друг друга не отменяют: уже идущая должна дойти.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Скрипт же и проверяет состав и местные ссылки: раскладка с битой
      # ссылкой не уезжает.
      - name: Собрать сайт
        run: ./tools/build-site.sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
