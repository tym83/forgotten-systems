# Публикация сайта серии на GitHub Pages.
#
# Классический источник Pages умеет отдавать только корень репозитория или
# /docs, а сайт лежит в /site — там же, где его собирает impl/Makefile.
# Поэтому раскладка идёт через Actions: содержимое /site уезжает артефактом.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные раскладки друг друга не отменяют: уже идущая должна дойти.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
